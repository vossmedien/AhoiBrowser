name: AhoiMobile
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
packages:
  AhoiCloudKitSpike:
    path: ../../spikes/cloudkit
targets:
  AhoiMobileCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AhoiMobileCore
    dependencies:
      - package: AhoiCloudKitSpike
        product: AhoiCloudKitSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_MOBILE_CORE_BUNDLE_ID)"
        AHOI_MOBILE_CORE_BUNDLE_ID: invalid.ahoibrowser.unconfigured.core
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
  AhoiMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/AhoiMobileApp
    dependencies:
      - target: AhoiMobileCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AhoiBrowser
        CFBundleShortVersionString: "$(AHOI_MOBILE_MARKETING_VERSION)"
        CFBundleVersion: "$(AHOI_MOBILE_BUILD_NUMBER)"
        AHOI_CLOUDKIT_CONTAINER_ID: "$(AHOI_CLOUDKIT_CONTAINER_ID)"
        AHOI_COMMAND_KEYCHAIN_ACCESS_GROUP: "$(AHOI_COMMAND_KEYCHAIN_ACCESS_GROUP)"
        AHOI_COMMAND_KEYCHAIN_ACCOUNT: "$(AHOI_COMMAND_KEYCHAIN_ACCOUNT)"
        AHOI_COMMAND_KEYCHAIN_SERVICE: "$(AHOI_COMMAND_KEYCHAIN_SERVICE)"
        AHOI_SYNC_KEYCHAIN_ACCESS_GROUP: "$(AHOI_SYNC_KEYCHAIN_ACCESS_GROUP)"
        AHOI_SYNC_KEYCHAIN_ACCOUNT: "$(AHOI_SYNC_KEYCHAIN_ACCOUNT)"
        AHOI_SYNC_KEYCHAIN_SERVICE: "$(AHOI_SYNC_KEYCHAIN_SERVICE)"
        AHOI_SYNC_KEY_VERSION: "$(AHOI_SYNC_KEY_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: AhoiBrowser asks only when a website you are using requests the camera.
        NSMicrophoneUsageDescription: AhoiBrowser asks only when a website you are using requests the microphone.
        NSMotionUsageDescription: AhoiBrowser asks only when a website you are using requests motion sensors.
        NSLocationWhenInUseUsageDescription: AhoiBrowser asks only when a website you are using requests your location.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        UIBackgroundModes:
          - remote-notification
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: AhoiBrowser Web Links
            CFBundleURLSchemes:
              - http
              - https
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_MOBILE_BUNDLE_ID)"
        AHOI_MOBILE_BUNDLE_ID: invalid.ahoibrowser.unconfigured.mobile
        AHOI_MOBILE_MARKETING_VERSION: __AHOI_MARKETING_VERSION_UNRESOLVED__
        AHOI_MOBILE_BUILD_NUMBER: __AHOI_BUILD_NUMBER_UNRESOLVED__
        AHOI_MOBILE_TEST_BUNDLE_ID: __AHOI_TEST_BUNDLE_ID_UNRESOLVED__
        AHOI_MOBILE_UI_TEST_BUNDLE_ID: __AHOI_UI_TEST_BUNDLE_ID_UNRESOLVED__
        AHOI_APP_USES_NON_EXEMPT_ENCRYPTION: __AHOI_EXPORT_COMPLIANCE_UNRESOLVED__
        MARKETING_VERSION: "$(AHOI_MOBILE_MARKETING_VERSION)"
        CURRENT_PROJECT_VERSION: "$(AHOI_MOBILE_BUILD_NUMBER)"
        VERSIONING_SYSTEM: apple-generic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "$(AHOI_APP_USES_NON_EXEMPT_ENCRYPTION)"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AhoiMobile.entitlements.template
        DEVELOPMENT_TEAM: "$(AHOI_APPLE_TEAM_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(AHOI_PROVISIONING_PROFILE_SPECIFIER)"
        AHOI_APPLE_TEAM_ID: ""
        AHOI_PROVISIONING_PROFILE_SPECIFIER: ""
        AHOI_APS_ENVIRONMENT: development
        AHOI_CLOUDKIT_CONTAINER_ENVIRONMENT: Development
        AHOI_CLOUDKIT_CONTAINER_ID: ""
        AHOI_COMMAND_KEYCHAIN_ACCESS_GROUP: ""
        AHOI_COMMAND_KEYCHAIN_ACCOUNT: ""
        AHOI_COMMAND_KEYCHAIN_SERVICE: ""
        AHOI_SYNC_KEYCHAIN_ACCESS_GROUP: ""
        AHOI_SYNC_KEYCHAIN_ACCOUNT: ""
        AHOI_SYNC_KEYCHAIN_SERVICE: ""
        AHOI_SYNC_KEY_VERSION: ""
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          AHOI_MOBILE_MARKETING_VERSION: "0.1"
          AHOI_MOBILE_BUILD_NUMBER: "1"
          AHOI_MOBILE_TEST_BUNDLE_ID: invalid.ahoibrowser.unconfigured.mobile.tests
          AHOI_MOBILE_UI_TEST_BUNDLE_ID: invalid.ahoibrowser.unconfigured.mobile.uitests
          # Debug is deliberately classified as exempt so unsigned simulator and
          # local development builds remain available. Release must override the
          # unresolved base value after an explicit export-compliance decision.
          AHOI_APP_USES_NON_EXEMPT_ENCRYPTION: NO
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          AHOI_APS_ENVIRONMENT: production
          AHOI_CLOUDKIT_CONTAINER_ENVIRONMENT: Production
          # This template intentionally fails signing until Apple has granted
          # the managed entitlement to the final bundle/profile.
          CODE_SIGN_ENTITLEMENTS: AhoiMobile.DefaultBrowser.entitlements.template
    preBuildScripts:
      - name: Mobile release settings preflight
        script: |
          "$SRCROOT/scripts/release-preflight.sh" --build-settings
        basedOnDependencyAnalysis: false
  AhoiMobileCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AhoiMobileCoreTests
    dependencies:
      - target: AhoiMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_MOBILE_TEST_BUNDLE_ID)"
        AHOI_MOBILE_TEST_BUNDLE_ID: __AHOI_TEST_BUNDLE_ID_UNRESOLVED__
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          AHOI_MOBILE_TEST_BUNDLE_ID: invalid.ahoibrowser.unconfigured.mobile.tests
  AhoiMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AhoiMobileUITests
    dependencies:
      - target: AhoiMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_MOBILE_UI_TEST_BUNDLE_ID)"
        AHOI_MOBILE_UI_TEST_BUNDLE_ID: __AHOI_UI_TEST_BUNDLE_ID_UNRESOLVED__
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          AHOI_MOBILE_UI_TEST_BUNDLE_ID: invalid.ahoibrowser.unconfigured.mobile.uitests

schemes:
  AhoiMobile:
    build:
      targets:
        AhoiMobile: all
        AhoiMobileCore: all
        AhoiMobileCoreTests: [test]
        AhoiMobileUITests: [test]
    test:
      targets:
        - AhoiMobileCoreTests
        - AhoiMobileUITests
