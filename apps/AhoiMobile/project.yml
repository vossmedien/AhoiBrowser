name: AhoiMobile
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
packages:
  AhoiCloudKitSpike:
    path: ../../spikes/cloudkit
targets:
  AhoiMobileCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AhoiMobileCore
    dependencies:
      - package: AhoiCloudKitSpike
        product: AhoiCloudKitSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_MOBILE_CORE_BUNDLE_ID)"
        AHOI_MOBILE_CORE_BUNDLE_ID: invalid.ahoibrowser.unconfigured.core
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
  AhoiMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/AhoiMobileApp
    dependencies:
      - target: AhoiMobileCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AhoiBrowser
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        AHOI_CLOUDKIT_CONTAINER_ID: "$(AHOI_CLOUDKIT_CONTAINER_ID)"
        AHOI_COMMAND_KEYCHAIN_ACCESS_GROUP: "$(AHOI_COMMAND_KEYCHAIN_ACCESS_GROUP)"
        AHOI_COMMAND_KEYCHAIN_ACCOUNT: "$(AHOI_COMMAND_KEYCHAIN_ACCOUNT)"
        AHOI_COMMAND_KEYCHAIN_SERVICE: "$(AHOI_COMMAND_KEYCHAIN_SERVICE)"
        AHOI_SYNC_KEYCHAIN_ACCESS_GROUP: "$(AHOI_SYNC_KEYCHAIN_ACCESS_GROUP)"
        AHOI_SYNC_KEYCHAIN_ACCOUNT: "$(AHOI_SYNC_KEYCHAIN_ACCOUNT)"
        AHOI_SYNC_KEYCHAIN_SERVICE: "$(AHOI_SYNC_KEYCHAIN_SERVICE)"
        AHOI_SYNC_KEY_VERSION: "$(AHOI_SYNC_KEY_VERSION)"
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: AhoiBrowser asks only when a website you are using requests the camera.
        NSMicrophoneUsageDescription: AhoiBrowser asks only when a website you are using requests the microphone.
        NSMotionUsageDescription: AhoiBrowser asks only when a website you are using requests motion sensors.
        NSLocationWhenInUseUsageDescription: AhoiBrowser asks only when a website you are using requests your location.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: AhoiBrowser Web Links
            CFBundleURLSchemes:
              - http
              - https
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_MOBILE_BUNDLE_ID)"
        AHOI_MOBILE_BUNDLE_ID: invalid.ahoibrowser.unconfigured.mobile
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AhoiMobile.entitlements.template
        DEVELOPMENT_TEAM: "$(AHOI_APPLE_TEAM_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(AHOI_PROVISIONING_PROFILE_SPECIFIER)"
        AHOI_APPLE_TEAM_ID: ""
        AHOI_PROVISIONING_PROFILE_SPECIFIER: ""
        AHOI_APS_ENVIRONMENT: development
        AHOI_CLOUDKIT_CONTAINER_ID: ""
        AHOI_COMMAND_KEYCHAIN_ACCESS_GROUP: ""
        AHOI_COMMAND_KEYCHAIN_ACCOUNT: ""
        AHOI_COMMAND_KEYCHAIN_SERVICE: ""
        AHOI_SYNC_KEYCHAIN_ACCESS_GROUP: ""
        AHOI_SYNC_KEYCHAIN_ACCOUNT: ""
        AHOI_SYNC_KEYCHAIN_SERVICE: ""
        AHOI_SYNC_KEY_VERSION: ""
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          AHOI_APS_ENVIRONMENT: production
          # This template intentionally fails signing until Apple has granted
          # the managed entitlement to the final bundle/profile.
          CODE_SIGN_ENTITLEMENTS: AhoiMobile.DefaultBrowser.entitlements.template
  AhoiMobileCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AhoiMobileCoreTests
    dependencies:
      - target: AhoiMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: invalid.ahoibrowser.unconfigured.mobile.tests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
  AhoiMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AhoiMobileUITests
    dependencies:
      - target: AhoiMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: invalid.ahoibrowser.unconfigured.mobile.uitests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AhoiMobile:
    build:
      targets:
        AhoiMobile: all
        AhoiMobileCore: all
        AhoiMobileCoreTests: [test]
        AhoiMobileUITests: [test]
    test:
      targets:
        - AhoiMobileCoreTests
        - AhoiMobileUITests
