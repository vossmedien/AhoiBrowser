name: AhoiMobile
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
configs:
  DebugLocal: debug
  CloudKitDevelopment: debug
  TestFlightBootstrap: release
  DefaultBrowserDevelopment: debug
  ReleasePostGrant: release
configFiles:
  DebugLocal: Configurations/DebugLocal.xcconfig
  CloudKitDevelopment: Configurations/CloudKitDevelopment.xcconfig
  TestFlightBootstrap: Configurations/TestFlightBootstrap.xcconfig
  DefaultBrowserDevelopment: Configurations/DefaultBrowserDevelopment.xcconfig
  ReleasePostGrant: Configurations/ReleasePostGrant.xcconfig
packages:
  AhoiCloudKitSpike:
    path: ../../spikes/cloudkit
targets:
  AhoiMobileCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AhoiMobileCore
    dependencies:
      - package: AhoiCloudKitSpike
        product: AhoiCloudKitSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_MOBILE_CORE_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
  AhoiMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/AhoiMobileApp
    dependencies:
      - target: AhoiMobileCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AhoiBrowser
        CFBundleShortVersionString: "$(AHOI_MOBILE_MARKETING_VERSION)"
        CFBundleVersion: "$(AHOI_MOBILE_BUILD_NUMBER)"
        AhoiSourceCommit: "$(AHOI_SOURCE_COMMIT)"
        AhoiBuildMode: "$(AHOI_BUILD_MODE)"
        AHOI_CLOUDKIT_CONTAINER_ID: "$(AHOI_CLOUDKIT_CONTAINER_ID)"
        AHOI_COMMAND_KEYCHAIN_ACCESS_GROUP: "$(AHOI_COMMAND_KEYCHAIN_ACCESS_GROUP)"
        AHOI_COMMAND_KEYCHAIN_ACCOUNT: "$(AHOI_COMMAND_KEYCHAIN_ACCOUNT)"
        AHOI_COMMAND_KEYCHAIN_SERVICE: "$(AHOI_COMMAND_KEYCHAIN_SERVICE)"
        AHOI_SYNC_KEYCHAIN_ACCESS_GROUP: "$(AHOI_SYNC_KEYCHAIN_ACCESS_GROUP)"
        AHOI_SYNC_KEYCHAIN_ACCOUNT: "$(AHOI_SYNC_KEYCHAIN_ACCOUNT)"
        AHOI_SYNC_KEYCHAIN_SERVICE: "$(AHOI_SYNC_KEYCHAIN_SERVICE)"
        AHOI_SYNC_KEY_VERSION: "$(AHOI_SYNC_KEY_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: AhoiBrowser asks only when a website you are using requests the camera.
        NSMicrophoneUsageDescription: AhoiBrowser asks only when a website you are using requests the microphone.
        NSMotionUsageDescription: AhoiBrowser asks only when a website you are using requests motion sensors.
        NSLocationWhenInUseUsageDescription: AhoiBrowser asks only when a website you are using requests your location.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        UIBackgroundModes:
          - remote-notification
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: AhoiBrowser Web Links
            CFBundleURLSchemes:
              - http
              - https
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_MOBILE_BUNDLE_ID)"
        MARKETING_VERSION: "$(AHOI_MOBILE_MARKETING_VERSION)"
        CURRENT_PROJECT_VERSION: "$(AHOI_MOBILE_BUILD_NUMBER)"
        VERSIONING_SYSTEM: apple-generic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "$(AHOI_APP_USES_NON_EXEMPT_ENCRYPTION)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(AHOI_APPLE_TEAM_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(AHOI_PROVISIONING_PROFILE_SPECIFIER)"
      configs:
        DebugLocal:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          CODE_SIGN_ENTITLEMENTS: ""
        CloudKitDevelopment:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          CODE_SIGN_ENTITLEMENTS: AhoiMobile.entitlements.template
        TestFlightBootstrap:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          CODE_SIGN_ENTITLEMENTS: AhoiMobile.entitlements.template
        DefaultBrowserDevelopment:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          CODE_SIGN_ENTITLEMENTS: AhoiMobile.DefaultBrowser.entitlements.template
        ReleasePostGrant:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          CODE_SIGN_ENTITLEMENTS: AhoiMobile.DefaultBrowser.entitlements.template
    preBuildScripts:
      - name: Mobile signing mode preflight
        script: |
          "$SRCROOT/scripts/release-preflight.sh" --build-settings
        basedOnDependencyAnalysis: false
  AhoiMobileCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AhoiMobileCoreTests
    dependencies:
      - target: AhoiMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_MOBILE_TEST_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
  AhoiMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AhoiMobileUITests
    dependencies:
      - target: AhoiMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_MOBILE_UI_TEST_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AhoiMobile:
    build:
      targets:
        AhoiMobile: all
        AhoiMobileCore: all
        AhoiMobileCoreTests: [test]
        AhoiMobileUITests: [test]
    run:
      config: DebugLocal
    test:
      config: DebugLocal
      targets:
        - AhoiMobileCoreTests
        - AhoiMobileUITests
    analyze:
      config: DebugLocal
    archive:
      config: TestFlightBootstrap
  AhoiMobile-CloudKitDevelopment:
    build:
      targets:
        AhoiMobile: all
        AhoiMobileCore: all
        AhoiMobileCoreTests: [test]
        AhoiMobileUITests: [test]
    run:
      config: CloudKitDevelopment
    test:
      config: CloudKitDevelopment
      targets:
        - AhoiMobileCoreTests
        - AhoiMobileUITests
    analyze:
      config: CloudKitDevelopment
  AhoiMobile-TestFlightBootstrap:
    build:
      targets:
        AhoiMobile: all
        AhoiMobileCore: all
    analyze:
      config: TestFlightBootstrap
    archive:
      config: TestFlightBootstrap
  AhoiMobile-DefaultBrowserDevelopment:
    build:
      targets:
        AhoiMobile: all
        AhoiMobileCore: all
        AhoiMobileCoreTests: [test]
        AhoiMobileUITests: [test]
    run:
      config: DefaultBrowserDevelopment
    test:
      config: DefaultBrowserDevelopment
      targets:
        - AhoiMobileCoreTests
        - AhoiMobileUITests
    analyze:
      config: DefaultBrowserDevelopment
  AhoiMobile-ReleasePostGrant:
    build:
      targets:
        AhoiMobile: all
        AhoiMobileCore: all
    analyze:
      config: ReleasePostGrant
    archive:
      config: ReleasePostGrant
