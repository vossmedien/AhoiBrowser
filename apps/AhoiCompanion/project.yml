name: AhoiCompanion
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
packages:
  AhoiCloudKitSpike:
    path: ../../spikes/cloudkit
targets:
  AhoiCompanionCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AhoiCompanionCore
    dependencies:
      - package: AhoiCloudKitSpike
        product: AhoiCloudKitSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_COMPANION_CORE_BUNDLE_ID)"
        AHOI_COMPANION_CORE_BUNDLE_ID: invalid.ahoibrowser.unconfigured.core
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
  AhoiCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources/AhoiCompanionApp
    dependencies:
      - target: AhoiCompanionCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Ahoi Companion
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        AHOI_CLOUDKIT_CONTAINER_ID: "$(AHOI_CLOUDKIT_CONTAINER_ID)"
        AHOI_COMMAND_KEYCHAIN_ACCESS_GROUP: "$(AHOI_COMMAND_KEYCHAIN_ACCESS_GROUP)"
        AHOI_COMMAND_KEYCHAIN_ACCOUNT: "$(AHOI_COMMAND_KEYCHAIN_ACCOUNT)"
        AHOI_COMMAND_KEYCHAIN_SERVICE: "$(AHOI_COMMAND_KEYCHAIN_SERVICE)"
        AHOI_SYNC_KEYCHAIN_ACCESS_GROUP: "$(AHOI_SYNC_KEYCHAIN_ACCESS_GROUP)"
        AHOI_SYNC_KEYCHAIN_ACCOUNT: "$(AHOI_SYNC_KEYCHAIN_ACCOUNT)"
        AHOI_SYNC_KEYCHAIN_SERVICE: "$(AHOI_SYNC_KEYCHAIN_SERVICE)"
        AHOI_SYNC_KEY_VERSION: "$(AHOI_SYNC_KEY_VERSION)"
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AHOI_COMPANION_BUNDLE_ID)"
        AHOI_COMPANION_BUNDLE_ID: invalid.ahoibrowser.unconfigured.companion
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AhoiCompanion.entitlements.template
        DEVELOPMENT_TEAM: "$(AHOI_APPLE_TEAM_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(AHOI_PROVISIONING_PROFILE_SPECIFIER)"
        AHOI_APPLE_TEAM_ID: ""
        AHOI_PROVISIONING_PROFILE_SPECIFIER: ""
        AHOI_APS_ENVIRONMENT: development
        AHOI_CLOUDKIT_CONTAINER_ID: ""
        AHOI_COMMAND_KEYCHAIN_ACCESS_GROUP: ""
        AHOI_COMMAND_KEYCHAIN_ACCOUNT: ""
        AHOI_COMMAND_KEYCHAIN_SERVICE: ""
        AHOI_SYNC_KEYCHAIN_ACCESS_GROUP: ""
        AHOI_SYNC_KEYCHAIN_ACCOUNT: ""
        AHOI_SYNC_KEYCHAIN_SERVICE: ""
        AHOI_SYNC_KEY_VERSION: ""
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          AHOI_APS_ENVIRONMENT: production
